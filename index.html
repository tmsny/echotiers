<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>EchoTiers • Community Ranking System</title>
    <!-- Google Fonts + Font Awesome 6 -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase modular SDKs (via import map) -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js"
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0A0F1E 0%, #02040C 50%, #0A1428 100%);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #EDF2F8;
            line-height: 1.5;
            scroll-behavior: smooth;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(6, 182, 212, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .glass-panel {
            background: rgba(12, 20, 35, 0.5);
            border-radius: 2rem;
            border: 1px solid rgba(66, 153, 225, 0.3);
            box-shadow: 
                0 20px 35px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease;
        }


        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.8rem 2rem;
        }

        /* Header */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1.4rem;
            margin-bottom: 2.5rem;
            animation: slideDownFade 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes slideDownFade {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-area {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        
        h1 {
            font-weight: 900;
            font-size: 2.4rem;
            background: linear-gradient(125deg, #06B6D4, #0EA5E9, #06B6D4);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: gradientShift 6s ease infinite;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        h1 img {
            height: 2.8rem;
            width: auto;
            vertical-align: middle;
            filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.6)) drop-shadow(0 0 25px rgba(14, 165, 233, 0.4));
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: logoFloat 3s ease-in-out infinite;
        }
        
        h1 img:hover {
            filter: drop-shadow(0 0 25px rgba(6, 182, 212, 1)) drop-shadow(0 0 40px rgba(14, 165, 233, 0.8)) brightness(1.3) hue-rotate(10deg);
            transform: scale(1.15) rotateY(10deg);
            animation: none;
        }
        
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px) rotateZ(0deg); }
            50% { transform: translateY(-8px) rotateZ(2deg); }
        }
        
        .badge-new {
            background: linear-gradient(135deg, #1E2A44, #0F3A52);
            padding: 0.45rem 1.2rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 800;
            color: #06B6D4;
            border: 1.5px solid rgba(6, 182, 212, 0.5);
            box-shadow: 
                0 6px 16px rgba(6, 182, 212, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            animation: float 4s ease-in-out infinite;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            animation: slideDownFade 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s backwards;
        }
        
        .discord-btn {
            background: linear-gradient(135deg, #5865F2, #4752C4);
            background-size: 200% 200%;
            padding: 0.95rem 1.8rem;
            border-radius: 60px;
            font-weight: 800;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 
                0 8px 20px rgba(88, 101, 242, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            letter-spacing: 0.3px;
        }
        
        .discord-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4752C4, #3838B8);
            transition: left 0.4s ease;
            z-index: -1;
        }
        
        .discord-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 
                0 14px 35px rgba(88, 101, 242, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
        }
        
        .discord-btn:hover::before {
            left: 0;
        }
        
        .discord-btn:active {
            transform: translateY(-2px) scale(0.98);
        }
        
        .discord-btn i {
            transition: all 0.3s ease;
        }
        
        .discord-btn:hover i {
            transform: rotate(10deg) scale(1.2);
        }
        
        .auth-card {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 60px;
            padding: 0.4rem 0.4rem 0.4rem 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.9rem;
            border: 1.5px solid rgba(6, 182, 212, 0.3);

            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        .auth-card:hover {
            border-color: rgba(6, 182, 212, 0.6);
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 
                0 0 24px rgba(6, 182, 212, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* Modus Buttons */
        .modes-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2.2rem;
            animation: slideUpFade 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s backwards;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.45);
            border-radius: 1.8rem;
            border: 1.5px solid rgba(6, 182, 212, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        .mode-btn-modern {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(6, 182, 212, 0.25);
            padding: 1rem 2rem;
            border-radius: 60px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #CBD5E1;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            letter-spacing: 0.3px;
        }
        
        .mode-btn-modern::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(6, 182, 212, 0.2));
            transition: left 0.4s ease;
        }
        
        .mode-btn-modern i {
            font-size: 1.1rem;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .mode-icon-img {
            height: 1.3rem;
            width: auto;
            object-fit: contain;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: brightness(0.8);
        }
        
        .mode-btn-modern.active {
            background: linear-gradient(135deg, #3B82F6, #0EA5E9);
            border-color: #06B6D4;
            color: white;
            box-shadow: 
                0 0 20px rgba(59,130,246,0.6),
                0 0 40px rgba(6,182,212,0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: scale(1.08) translateY(-2px);
        }
        
        .mode-btn-modern.active i {
            transform: scale(1.2) rotate(5deg);
            color: #FFF;
        }
        
        .mode-btn-modern.active .mode-icon-img {
            filter: brightness(1.3) drop-shadow(0 0 8px rgba(6, 182, 212, 0.6));
        }
        
        .mode-btn-modern:hover:not(.active) {
            background: rgba(50, 65, 85, 0.8);
            transform: translateY(-4px);
            border-color: rgba(6, 182, 212, 0.6);
            color: #F1F5F9;
            box-shadow: 
                0 8px 25px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .mode-btn-modern:hover:not(.active) i {
            transform: scale(1.1);
        }
        
        .mode-btn-modern:hover:not(.active) .mode-icon-img {
            filter: brightness(1.1);
        }
        
        .mode-btn-modern:active {
            transform: translateY(-2px) scale(0.96);
        }

        /* Filterleiste */
        .filter-modern {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 2.2rem;
            padding: 1.3rem 2rem;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.7), rgba(6, 30, 50, 0.5));
            backdrop-filter: blur(18px);
            border-radius: 1.3rem;
            border: 1.5px solid rgba(6, 182, 212, 0.3);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 
                0 10px 28px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            animation: slideUpFade 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s backwards;
        }
        
        .filter-modern:hover {
            border-color: rgba(6, 182, 212, 0.5);
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(6, 30, 50, 0.6));
            box-shadow: 
                0 12px 36px rgba(6, 182, 212, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        
        .filter-group {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .search-input, .tier-select-filter {
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid rgba(6, 182, 212, 0.3);
            padding: 0.9rem 1.6rem;
            border-radius: 50px;
            color: #EDF2F8;
            font-size: 0.95rem;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            outline: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(8px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
            font-weight: 500;
        }
        
        .search-input::placeholder {
            color: rgba(165, 180, 210, 0.5);
        }
        
        .search-input:hover, .tier-select-filter:hover {
            border-color: rgba(6, 182, 212, 0.5);
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 
                0 0 20px rgba(6, 182, 212, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .search-input:focus, .tier-select-filter:focus {
            border-color: #06B6D4;
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 
                0 0 30px rgba(6, 182, 212, 0.5),
                inset 0 0 15px rgba(6, 182, 212, 0.15);
            transform: scale(1.03);
            outline: none;
        }
        
        .tier-select-filter {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306B6D4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 18px;
            padding-right: 2.5rem;
            text-overflow: clip;
        }
        
        .tier-select-filter option {
            background: #0F172A;
            color: #EDF2F8;
            padding: 0.5rem;
        }
        
        .role-indicator {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 30, 50, 0.7));
            padding: 0.6rem 1.4rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1.5px solid rgba(6, 182, 212, 0.3);
            display: flex;
            align-items: center;
            gap: 0.7rem;
            transition: all 0.3s ease;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        
        .role-indicator:hover {
            border-color: rgba(6, 182, 212, 0.5);
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 30, 50, 0.8));
            box-shadow: 
                0 0 16px rgba(6, 182, 212, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Spieler Tabelle */
        .players-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            overflow: hidden;
            border-radius: 1.8rem;
            border: 1.5px solid rgba(6, 182, 212, 0.3);
            background: rgba(15, 25, 45, 0.35);
            backdrop-filter: blur(15px);
            animation: slideUpFade 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s backwards;
            padding: 0.8rem;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        .player-card {
            background: linear-gradient(135deg, rgba(20, 30, 48, 0.7), rgba(12, 22, 40, 0.5));
            backdrop-filter: blur(10px);
            border-radius: 1.2rem;
            padding: 1.4rem 2rem;
            display: grid;
            grid-template-columns: 56px 200px 120px 1fr auto;
            align-items: center;
            gap: 1.6rem;
            border: 1.5px solid rgba(6, 182, 212, 0.2);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: none;
            cursor: pointer;
            position: relative;
            align-self: center;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        .player-card.overall-player-card {
            grid-template-columns: auto 56px 180px 100px 1fr auto;
            align-items: flex-start;
        }
        
        .player-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.1), transparent);
            transition: left 0.6s ease;
        }
        
        .player-card:hover::before {
            left: 100%;
        }
        
        .player-card:last-child {
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
        }
        
        .player-card:hover {
            transform: translateX(10px) translateY(-3px);
            border-color: rgba(6, 182, 212, 0.6);
            background: linear-gradient(135deg, rgba(30, 50, 80, 0.8), rgba(10, 30, 50, 0.6));
            box-shadow: 
                0 14px 40px rgba(6, 182, 212, 0.25),
                inset 0 0 40px rgba(6, 182, 212, 0.12);
        }
        
        .player-card:active {
            transform: translateX(8px) translateY(0px) scale(0.99);
        }
        
        .player-info {
            display: contents;
        }
        
        .avatar {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #0F172A, #1a2849);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 8px 24px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            grid-column: 1;
            border: 1.5px solid rgba(6, 182, 212, 0.3);
            flex-shrink: 0;
        }
        
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .player-card:hover .avatar {
            transform: scale(1.15) rotateZ(8deg);
            border-radius: 18px;
            box-shadow: 
                0 10px 32px rgba(6, 182, 212, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            border-color: rgba(6, 182, 212, 0.7);
        }
        
        .player-name {
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: -0.2px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: linear-gradient(125deg, #06B6D4, #0EA5E9);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            order: 4;
            min-width: 120px;
            flex: 0 1 auto;
            white-space: nowrap;
        }

        .cracked-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.2rem 0.45rem;
            border-radius: 999px;
            font-size: 0.65rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #FEE2E2;
            background: rgba(239, 68, 68, 0.14);
            border: 1.5px solid rgba(239, 68, 68, 0.45);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }
        
        .player-card:hover .player-name {
            color: #06B6D4;
            background-position: 100% 0;
            letter-spacing: 0px;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }
        
        .tier-modern {
            padding: 0.6rem 1.3rem;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.95rem;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: #1e293b;
            box-shadow: 
                0 6px 16px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            grid-column: 3;
            border: 1.5px solid rgba(100, 150, 255, 0.2);
            letter-spacing: 0.3px;
        }
        
        .player-card:hover .tier-modern {
            transform: scale(1.08) translateY(-2px);
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .player-notes {
            font-size: 0.9rem;
            color: #94A3B8;
            grid-column: 4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: all 0.4s ease;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        
        .player-card:hover .player-notes {
            color: #CBD5E1;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.25);
        }
        
        .admin-actions {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            grid-column: 5;
            animation: fadeInScale 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .tier-NT { 
            background: linear-gradient(135deg, #64748B, #475569); 
            color: #F1F5F9;
            box-shadow: 0 0 18px rgba(100, 116, 139, 0.6);
            border: 2px solid rgba(100, 116, 139, 0.5);
        }
        .tier-HT1 { 
            background: linear-gradient(135deg, #FF6B9D, #FF1493); 
            color: #FFF; 
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.7);
            border: 2px solid rgba(255, 20, 147, 0.6);
        }
        .tier-HT2 { 
            background: linear-gradient(135deg, #FF9500, #FF6D00); 
            color: #FFF;
            box-shadow: 0 0 20px rgba(255, 109, 0, 0.7);
            border: 2px solid rgba(255, 109, 0, 0.6);
        }
        .tier-HT3 { 
            background: linear-gradient(135deg, #26C6DA, #00BCD4);
            color: #FFF;
            box-shadow: 0 0 20px rgba(0, 188, 212, 0.7);
            border: 2px solid rgba(0, 188, 212, 0.6);
        }
        .tier-HT4 { 
            background: linear-gradient(135deg, #7C3AED, #6D28D9);
            color: #FFF;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.7);

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: linear-gradient(135deg, rgba(12, 20, 35, 0.98), rgba(6, 30, 50, 0.98));
            border: 1px solid rgba(6, 182, 212, 0.5);
            border-radius: 2.5rem;
            padding: 3rem;
            max-width: 900px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.9),
                0 0 80px rgba(6, 182, 212, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            position: relative;
            animation: slideInScale 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            scrollbar-width: none;
        }
        
        @keyframes slideInScale {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(-40px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        .modal-content::-webkit-scrollbar {
            display: none;
        }

            position: absolute;
            top: 1.8rem;
            right: 1.8rem;
            background: linear-gradient(135deg, #FF6B6B, #FA5252);

           Admin kann Text setzen + Border-Farbe wählen.
           Normal-User sieht nur 3 Buchstaben und Hover-Tooltip mit vollem Text.
        */
        .overall-alias {
            grid-column: 4;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 0.95rem;
            border-radius: 999px;
            font-weight: 900;
            font-size: 0.85rem;
            letter-spacing: 0.12px;
            color: #E2E8F0;
            border: 2px solid rgba(6, 182, 212, 0.35);
            background: rgba(15, 23, 42, 0.35);
            min-width: 70px;
            position: relative;
            box-shadow:
                0 10px 28px rgba(0,0,0,0.25),
                inset 0 1px 0 rgba(255,255,255,0.06);
            cursor: default;
            align-self: center;
            user-select: none;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            max-width: 100%;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            text-transform: uppercase;
        }

        }

.overall-alias .alias-tooltip {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 14px);
            transform: translateX(-50%) translateY(6px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.15s ease;
            background: rgba(2, 6, 23, 0.92);
            border: 1.5px solid rgba(6, 182, 212, 0.45);
            color: #EAF2FF;
            border-radius: 14px;

                0 22px 60px rgba(0,0,0,0.70),

            font-weight: 900;
            letter-spacing: 0.12px;
            z-index: 9999;
            white-space: nowrap;

            content: '';

            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 7px;
            border-style: solid;
            border-color: rgba(2, 6, 23, 0.88) transparent transparent transparent;

        /* Main Smooth Spinner */

            width: 56px;
            height: 56px;

        }

        .spinner-glow {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(6, 182, 212, 0.1);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.3) 0%, transparent 70%);
            animation: spinGlow 1.4s ease-in-out infinite;
            box-shadow: 
                0 0 20px rgba(6, 182, 212, 0.4),
                0 0 40px rgba(6, 182, 212, 0.2),
                inset 0 0 20px rgba(6, 182, 212, 0.1);
        }
        
        /* Double Ring Spinner */
        .spinner-double {
            width: 48px;
            height: 48px;
            position: relative;
            display: inline-block;
        }
        
        .spinner-double::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid rgba(6, 182, 212, 0.2);
            border-top-color: #06B6D4;
            border-radius: 50%;
            animation: spinSmooth 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        
        .spinner-double::after {
            content: '';
            position: absolute;
            width: 85%;
            height: 85%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(14, 165, 233, 0.3);
            border-top-color: #0EA5E9;
            border-radius: 50%;
            animation: spinSmooth 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite reverse;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }
        
        /* Wave Spinner */
        .spinner-wave {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            width: 50px;
            height: 40px;
        }
        
        .spinner-wave span {
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #06B6D4, #0EA5E9);
            border-radius: 2px;
            animation: waveMove 1.2s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
        }
        
        .spinner-wave span:nth-child(1) { animation-delay: 0s; }
        .spinner-wave span:nth-child(2) { animation-delay: 0.15s; }
        .spinner-wave span:nth-child(3) { animation-delay: 0.3s; }
        .spinner-wave span:nth-child(4) { animation-delay: 0.45s; }
        .spinner-wave span:nth-child(5) { animation-delay: 0.6s; }
        
        /* Orbital Spinner */
        .spinner-orbital {
            width: 50px;
            height: 50px;
            position: relative;
            display: inline-block;
        }
        
        .spinner-orbital::before {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #06B6D4;
            border-radius: 50%;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            animation: orbitSpin 1.8s linear infinite;
            box-shadow: 
                0 0 12px rgba(6, 182, 212, 0.6),

        }
        
        .spinner-orbital::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            border: 2px dashed rgba(6, 182, 212, 0.2);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

        .spinner-dots span:nth-child(1) { animation-delay: -0.32s; }
        .spinner-dots span:nth-child(2) { animation-delay: -0.16s; }
        .spinner-dots span:nth-child(3) { animation-delay: 0s; }
        
        /* Main Animation Keyframes */
        @keyframes spinSmooth {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        @keyframes spinGlow {
            0%, 100% {
                box-shadow: 
                    0 0 20px rgba(6, 182, 212, 0.2),
                    0 0 40px rgba(6, 182, 212, 0.1),
                    inset 0 0 20px rgba(6, 182, 212, 0.05);
                transform: scale(1);
            }
            50% {
                box-shadow: 
                    0 0 40px rgba(6, 182, 212, 0.5),
                    0 0 80px rgba(6, 182, 212, 0.3),
                    inset 0 0 30px rgba(6, 182, 212, 0.2);
                transform: scale(1.1);
            }
        }
        
        @keyframes waveMove {
            0%, 100% {
                height: 100%;
                opacity: 0.6;
            }
            50% {
                height: 40%;
                opacity: 1;
            }
        }
        
        @keyframes orbitSpin {
            0% {
                transform: translateX(-50%) rotate(0deg) translateY(-20px) rotate(0deg);
            }
            100% {
                transform: translateX(-50%) rotate(360deg) translateY(-20px) rotate(-360deg);
            }
        }
        
        @keyframes dotsBounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }

        /* Smooth Fade In Animation */
        @keyframes fadeInScale {

            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Smartphone/Tablet: kleiner Layout-Fit */
        @media (max-width: 760px) {

    // Tier Label Mapping - zeige immer den vollständigen Tier-Namen an
    const TIER_LABELS = {
        "HT1": "HT1",
        "LT1": "LT1",
        "HT2": "HT2",
        "LT2": "LT2",
        "HT3": "HT3",
        "LT3": "LT3",
        "NT": "NT",
        "HT4": "HT4",
        "LT4": "LT4",
        "HT5": "HT5",
        "LT5": "LT5"
    };

    // Tier Color Info for UI - Moderne, lebendige Farben
    const TIER_COLOR_INFO = {
        "HT1": { bg: "linear-gradient(135deg, #FBBF24, #F59E0B)", border: "#F59E0B", text: "#FBBF24", label: "HT1" },
        "LT1": { bg: "linear-gradient(135deg, #FBBF24, #D97706)", border: "#D97706", text: "#FFF", label: "LT1" },
        "HT2": { bg: "linear-gradient(135deg, #E5E7EB, #9CA3AF)", border: "#9CA3AF", text: "#111827", label: "HT2" },
        "LT2": { bg: "linear-gradient(135deg, #F3F4F6, #D1D5DB)", border: "#9CA3AF", text: "#111827", label: "LT2" },
        "HT3": { bg: "linear-gradient(135deg, #22D3EE, #06B6D4)", border: "#06B6D4", text: "#FFF", label: "HT3" },
        "LT3": { bg: "linear-gradient(135deg, #67E8F9, #22D3EE)", border: "#22D3EE", text: "#111827", label: "LT3" },
        "NT": { bg: "linear-gradient(135deg, #64748B, #475569)", border: "#334155", text: "#F8FAFC", label: "NT" },
        "HT4": { bg: "linear-gradient(135deg, #A78BFA, #7C3AED)", border: "#7C3AED", text: "#FFF", label: "HT4" },
        "LT4": { bg: "linear-gradient(135deg, #C4B5FD, #A78BFA)", border: "#A78BFA", text: "#111827", label: "LT4" },
        "HT5": { bg: "linear-gradient(135deg, #F472B6, #EC4899)", border: "#EC4899", text: "#FFF", label: "HT5" },
        "LT5": { bg: "linear-gradient(135deg, #F9A8D4, #F472B6)", border: "#F472B6", text: "#111827", label: "LT5" }
    };
    
    
    // --- Global State ---
    let playersMap = {};        // id -> { name, tiers: { overall: "HT1", ... } }
    let currentMode = "overall";
    let tierlistMode = "current"; // UI-Selektor (wird nicht mehr für Overall-Points gebraucht, weil beide Subansichten gerendert werden)
    let searchQuery = "";
    let tierFilter = "all";
    let isAdminUser = false;    // nur wenn email = tomy.blasbichler@gmail.com UND eingeloggt
    let currentFirebaseUser = null;



    // --- Helper: Avatar wie auf mctiers (minotar helm 3D? aber classic face)
    const getAvatarUrl = (name) => `https://minotar.net/helm/${encodeURIComponent(name)}/56.png`;
    const getPlayerAvatarUrl = (player) => {
        const skinNameToUse = (player?.cracked && player?.skinName) ? player.skinName : player?.name;
        return `https://minotar.net/helm/${encodeURIComponent(skinNameToUse || '')}/56.png`;
    };


    // --- Region UI / Admin-configurable NA regions ---
    // Admin can configure which region strings should be highlighted as "NA" (red).
    // We persist it under playersMeta/naRegions as a comma-separated string.
    let naRegions = new Set(["NA"]);

    const DEFAULT_NA_REGION_STR = "NA";

    function parseNaRegionsCsv(csv) {
        if (!csv) return new Set(["NA"]);
        return new Set(
            String(csv)
                .split(",")
                .map(s => s.trim().toUpperCase())
                .filter(Boolean)
        );
    }

    function getRegionUI(regionValue) {
        const r = (regionValue || "NA").toUpperCase();
        const isNa = naRegions.has(r) || r === "NA";
        if (r === "EU") {
            return { className: "region-eu", label: "EU" };
        }
        if (isNa) {
            return { className: "region-na", label: r };
        }
        // default = green/neutral
        return { className: "region-default", label: r === "" ? "NA" : r };
    }

    async function loadNaRegionsConfig() {
        try {
            const snap = await get(ref(db, "playersMeta/naRegions"));
            if (snap.exists()) {
                naRegions = parseNaRegionsCsv(snap.val());
            } else {
                naRegions = parseNaRegionsCsv(DEFAULT_NA_REGION_STR);
            }
        } catch (e) {
            naRegions = parseNaRegionsCsv(DEFAULT_NA_REGION_STR);
        }
    }

    // --- Slash -> cracked parsing ---
    // Input example:
    //   "/Lukas" => cracked=true, name="Lukas" (skin/profile should use "Lukas")
    function parsePlayerInput(rawName) {
        const cleaned = String(rawName ?? "").trim();
        const cracked = cleaned.startsWith("/");
        const name = cracked ? cleaned.replace(/^\/+/, "").trim() : cleaned;
        return { name, cracked };
    }

    // Calculate total points for a player (all modes except overall)
    function getPlayerTotalPoints(player) {

        let totalPoints = 0;
        const modes = GAME_MODES.filter(m => m.id !== "overall");
        for (const mode of modes) {
            const src = tierlistMode === "prime" ? (player.primeTiers || player.tiers || {}) : (player.tiers || {});
            const tier = src?.[mode.id] || "NT";
            totalPoints += TIER_POINTS[tier] || 0;

        }
        return totalPoints;
    }


    // --- Tier CSS Klasse dynamisch
    function getTierStyle(tier) {
        const mapping = {
            "NT":"tier-NT",
            "HT1":"tier-HT1","HT2":"tier-HT2","HT3":"tier-HT3","HT4":"tier-HT4","HT5":"tier-HT5",
            "LT1":"tier-LT1","LT2":"tier-LT2","LT3":"tier-LT3","LT4":"tier-LT4","LT5":"tier-LT5"
        };
        return mapping[tier] || "tier-NT";
    }

    // --- Filter + Rendering
    function renderPlayers() {
        const container = document.getElementById("playersList");
        if (!container) return;

        // Overall mode - show players sorted by total points
        if (currentMode === "overall") {
            renderOverallMode(container);
        } else {
            // Other modes - show table with tier columns
            renderModeTable(container);
        }
    }

    function renderOverallMode(container) {
        let filtered = Object.values(playersMap);

        // IMPORTANT:
        // Ranking must not change when filtering by search.
        // We therefore keep the full list for rank calculation, but only narrow down what we render.
        let renderedFiltered = filtered;

        // Filter by search query (only affects rendering, not rank computation)
        if (searchQuery) {
            renderedFiltered = renderedFiltered.filter(p =>
                p.name.toLowerCase().includes(searchQuery.toLowerCase())
            );
        }

        // Sort by total points (descending)
        filtered.sort((a, b) => {
            const pointsA = getPlayerTotalPoints(a);
            const pointsB = getPlayerTotalPoints(b);
            return pointsB - pointsA;
        });


        // Tie handling (same Punkte => same Placement/Rank, next rank is skipped)
        const pointsToRank = new Map();
        let lastPoints = null;
        let lastRank = 0;
        for (let i = 0; i < filtered.length; i++) {
            const p = getPlayerTotalPoints(filtered[i]);
            if (lastPoints === null || p !== lastPoints) {
                lastRank = i + 1; // rank jumps by the block size automatically
                lastPoints = p;
            }
            pointsToRank.set(p, lastRank);
        }

        if (renderedFiltered.length === 0) {
            container.innerHTML = `<div class="empty-modern"><i class="fas fa-user-slash"></i> Keine Spieler gefunden.</div>`;
            return;
        }

        // Render order should follow the ranked order
        renderedFiltered.sort((a, b) => {
            const rankA = pointsToRank.get(getPlayerTotalPoints(a)) ?? 999999;
            const rankB = pointsToRank.get(getPlayerTotalPoints(b)) ?? 999999;
            if (rankA !== rankB) return rankA - rankB;
            return a.name.localeCompare(b.name);
        });


        // At this point `renderedFiltered` is sorted by the rank map.
        // Rendering uses the rank computed from the *full* filtered list (without search affecting ranks).


        let html = "";
        for (let idx = 0; idx < filtered.length; idx++) {
            const player = filtered[idx];
            const totalPoints = getPlayerTotalPoints(player);
            const placement = pointsToRank.get(totalPoints) || (idx + 1);
            let placementLabel = `#${placement}`;

            let placementColor = "#64748B"; // gray
            
            if (placement === 1) {
                placementColor = "#FFD700"; // gold
            } else if (placement === 2) {
                placementColor = "#C0C0C0"; // silver
            } else if (placement === 3) {
                placementColor = "#CD7F32"; // bronze
            }
            
        // Build modes with tier badges - sorted by tier level (high to low)
            const modes = GAME_MODES.filter(m => m.id !== "overall");
            let modesHtml = "";
            
            // Sort modes by tier level of this player
            const modesWithTier = modes.map(mode => {
                const srcTiers = tierlistMode === "prime" ? (player.primeTiers || player.tiers || {}) : (player.tiers || {});
                const srcMeta = tierlistMode === "prime" ? (player.primeTierMeta || {}) : (player.tierMeta || {});
                const tier = srcTiers?.[mode.id] || "NT";
                const tierPoints = TIER_POINTS[tier] || 0;
                const setAt = srcMeta?.[mode.id]?.setAt ?? 0;

                return { mode, tier, tierPoints, setAt };
            });
            
            // Sort by tier strength (higher first).
            // If same tier strength: older entry first (left).
            modesWithTier.sort((a, b) => {
                // 1) higher tier first
                if (b.tierPoints !== a.tierPoints) return b.tierPoints - a.tierPoints;

                // 2) same tier level => fixed mode order
                // Desired: mace, vanilla, uhc, axe, sword, smp, nethop, pot
                const modeOrder = {
                    mace: 1,
                    vanilla: 2,
                    uhc: 3,
                    axe: 4,
                    sword: 5,
                    smp: 6,
                    nethop: 7,
                    pot: 8
                };

                const orderA = modeOrder[a.mode.id] ?? 999;
                const orderB = modeOrder[b.mode.id] ?? 999;

                if (orderA !== orderB) return orderA - orderB;

                // 3) deterministic fallback
                return (a.setAt || 0) - (b.setAt || 0);
            });
            
            for (const item of modesWithTier) {
                const { mode, tier } = item;
                const colorInfo = TIER_COLOR_INFO[tier];
                const tierLabel = TIER_LABELS[tier] || tier;
                const tierGroup = tier.endsWith("1") ? "tier-1" : tier.endsWith("2") ? "tier-2" : tier.endsWith("3") ? "tier-3" : "tier-default";
                const modeIcon = mode.image ? `<img src="${mode.image}" alt="${mode.label}" style="height: 1.4rem; width: 1.4rem; object-fit: contain;">` : `<i class="fas ${mode.icon}" style="font-size: 1.4rem;"></i>`;
                const badgeStyle = currentMode === "overall" ? "" : `background: ${colorInfo.bg}; border: 2px solid ${colorInfo.border};`;
                
                modesHtml += `
                    <div class="mode-badge-with-tier ${tierGroup}">
                        <div class="mode-badge-icon">${modeIcon}</div>
                        <div class="tier-oval-badge tier-${tier}" style="${badgeStyle}">
                            <span style="color: ${colorInfo.text};">${tierLabel}</span>
                        </div>
                    </div>
                `;
            }
            
            const notesDisplay = player.notes ? escapeHtml(player.notes) : "–";



            html += `
                <div class="player-card overall-player-card" data-id="${player.id}">
                    <div class="placement-badge" style="color: ${placementColor};">${placementLabel}</div>
                    <div class="avatar">
                        <img src="${getPlayerAvatarUrl(player)}" alt="${player.name}" onerror="this.src='https://minotar.net/helm/steve/56.png'">
                    </div>
                    <div class="player-details">
                        <div style="display:flex; align-items:center; gap:0.5rem;">
                            <div class="player-name">${escapeHtml(player.name)}</div>
                            ${player.cracked ? `<div class="cracked-badge" title="Cracked">CRACKED</div>` : ``}
                        </div>
                        <div class="player-stats">${totalPoints} Punkte</div>
                    </div>

                    <div class="overall-alias" data-playerid="${player.id}" style="border-color: ${escapeHtml(player.overallAliasColor || '#06B6D4')}; background: rgba(15, 23, 42, 0.35); grid-row: 1; z-index: 50;">

                        <div class="alias-text">${escapeHtml((player.overallAliasText || 'NA').slice(0, 3))}</div>
                        <div class="alias-tooltip">${escapeHtml(player.overallAliasText || 'NA')}</div>
                    </div>

                    <div class="modes-grid">${modesHtml}</div>
                    <div class="player-notes">${notesDisplay}</div>
            `;
            
            if (isAdminUser) {
                html += `
                    <div class="admin-actions">
                        <div class="overall-alias admin-edit has-alias" data-overallalias="1" data-playerid="${player.id}" style="border-color: ${escapeHtml(player.overallAliasColor || '#06B6D4')}; background: rgba(2, 6, 23, 0.35);">
                            <div class="admin-alias-controls">
                                <input type="text" class="admin-overall-alias-input" value="${escapeHtml(player.overallAliasText || 'NA')}" placeholder="Alias">
                                <select class="admin-overall-alias-color">
                                    <option value="#06B6D4" ${player.overallAliasColor === '#06B6D4' ? 'selected' : ''}>#06B6D4</option>
                                    <option value="#0EA5E9" ${player.overallAliasColor === '#0EA5E9' ? 'selected' : ''}>#0EA5E9</option>
                                    <option value="#FBBF24" ${player.overallAliasColor === '#FBBF24' ? 'selected' : ''}>#FBBF24</option>
                                    <option value="#22D3EE" ${player.overallAliasColor === '#22D3EE' ? 'selected' : ''}>#22D3EE</option>
                                    <option value="#7C3AED" ${player.overallAliasColor === '#7C3AED' ? 'selected' : ''}>#7C3AED</option>
                                    <option value="#EC4899" ${player.overallAliasColor === '#EC4899' ? 'selected' : ''}>#EC4899</option>
                                    <option value="#10B981" ${player.overallAliasColor === '#10B981' ? 'selected' : ''}>#10B981</option>
                                    <option value="#EF4444" ${player.overallAliasColor === '#EF4444' ? 'selected' : ''}>#EF4444</option>
                                </select>
                                <button class="admin-save" data-overallalias="save" data-playerid="${player.id}" style="padding:0.45rem 0.7rem; font-size:0.7rem;"><i class="fas fa-check"></i></button>
                            </div>
                        </div>
                        <button class="admin-edit" data-player="${player.id}" data-name="${escapeHtml(player.name)}" title="Notizen bearbeiten"><i class="fas fa-edit"></i></button>
                        <button class="admin-delete" data-player="${player.id}" data-name="${escapeHtml(player.name)}"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            }

            html += `</div>`;
        }
        container.innerHTML = html;
        if (isAdminUser) {
            attachAdminListeners();
            // Ensure region selects in table also bound
            document.querySelectorAll(".admin-select:not([data-mode])").forEach(select => {
                select.removeEventListener("change", handleRegionChange);
                select.addEventListener("change", handleRegionChange);
            });
        }
        attachPlayerCardListeners();
    }

    function renderModeTable(container) {
        let filtered = Object.values(playersMap);
        
        // Filter by search query
        if (searchQuery) {
            filtered = filtered.filter(p => 
                p.name.toLowerCase().includes(searchQuery.toLowerCase())
            );
        }

        // Filter by tier if set
        if (tierFilter !== "all") {
            filtered = filtered.filter(p => {
                const src = tierlistMode === "prime" ? (p.primeTiers || p.tiers || {}) : (p.tiers || {});
                const playerTier = src?.[currentMode] || "NT";
                return playerTier === tierFilter;

            });
        }

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-modern"><i class="fas fa-user-slash"></i> Keine Spieler gefunden.</div>`;
            return;
        }

        // Create table structure with columns: NT, LT5, HT5, LT4, HT4, LT3, HT3, LT2, HT2, LT1, HT1
        // But we want: TIER 5, TIER 4, TIER 3, TIER 2, TIER 1, NT
        const tierColumns = [
            { label: "TIER 1", tiers: ["HT1", "LT1"] },
            { label: "TIER 2", tiers: ["HT2", "LT2"] },
            { label: "TIER 3", tiers: ["HT3", "LT3"] },
            { label: "TIER 4", tiers: ["HT4", "LT4"] },
            { label: "TIER 5", tiers: ["HT5", "LT5"] },
            { label: "NT", tiers: ["NT"] }
        ];

        let html = '<div class="modes-table">';
        
        for (const column of tierColumns) {
            const playersInColumn = filtered.filter(p => {
                const src = tierlistMode === "prime" ? (p.primeTiers || p.tiers || {}) : (p.tiers || {});
                const tier = src?.[currentMode] || "NT";
                return column.tiers.includes(tier);

            });

            // Sort: HT first (above), then LT (below) to make HT vs LT clearly readable
            playersInColumn.sort((a, b) => {
                const aSrc = tierlistMode === "prime" ? (a.primeTiers || a.tiers || {}) : (a.tiers || {});
                const bSrc = tierlistMode === "prime" ? (b.primeTiers || b.tiers || {}) : (b.tiers || {});
                const tierA = aSrc?.[currentMode] || "NT";
                const tierB = bSrc?.[currentMode] || "NT";


                const isHT_A = tierA.startsWith("HT");
                const isHT_B = tierB.startsWith("HT");

                if (isHT_A !== isHT_B) return isHT_A ? -1 : 1; // HT above LT

                // Same side (HT or LT): keep deterministic order
                if (tierA !== tierB) {
                    const idxA = column.tiers.indexOf(tierA);
                    const idxB = column.tiers.indexOf(tierB);
                    if (idxA !== idxB) return idxA - idxB;
                }

                return a.name.localeCompare(b.name);
            });

            html += `<div class="table-column">`;
            html += `<div class="table-column-header">${column.label}</div>`;
            html += `<div class="table-column-players">`;
            
            if (playersInColumn.length === 0) {
                html += `<div style="text-align: center; color: #64748B; font-size: 0.85rem; padding: 1.5rem 0;">Keine Spieler</div>`;
            } else {
                for (const player of playersInColumn) {
                    const src = tierlistMode === "prime" ? (player.primeTiers || player.tiers || {}) : (player.tiers || {});
                    const tier = src?.[currentMode] || "NT";
                    const tierClass = getTierStyle(tier);
                    const colorInfo = TIER_COLOR_INFO[tier];

                    
                    // Badge anzeigen wir nicht mehr (HT/LT soll über das umgebende Feld sichtbar sein)
                    // const tierLabel = TIER_LABELS[tier] || tier;
                    
                    let tierBadgeHtml = '';
                    // (Admin bleibt nutzbar über Tier-Select unten im Feld, falls nötig)
                    
                    const isHT = tier.startsWith('HT');

                    // HT soll im Table-Modus wie LT aussehen, aber
                    // - HT „nur oben“ (nur Umrandung, keine starke Füllung)
                    // - Umrandung entspricht exakt den Spaltenfarben (TIER 1..5)

                    // Füllung wie LT (gedämpft)
                    // LT soll NICHT umrundet sein: Standard-Textfeld bleibt neutral und ohne farbige Border.
                    // HT soll stark umrundet sein (inkl. farbiger Border nach Spalten-Farbton) und dabei nur sehr wenig Füllung haben.

                    // Füllung
                    const fieldBg = isHT
                        ? `linear-gradient(135deg, rgba(148,163,184,0.02), rgba(71,85,105,0.02))`
                        : `linear-gradient(135deg, rgba(148,163,184,0.00), rgba(71,85,105,0.00))`;

                    // Umrandung
                    const fieldBorder = isHT
                        ? {
                            "HT1": "rgba(251, 191, 36, 0.75)",
                            "HT2": "rgba(148, 163, 184, 0.80)",
                            "HT3": "rgba(205, 127, 50, 0.80)",
                            "HT4": "rgba(124, 58, 237, 0.80)",
                            "HT5": "rgba(236, 72, 153, 0.80)",
                            "NT": "rgba(100, 116, 139, 0.22)"
                          }[tier] || 'rgba(148, 163, 184, 0.22)'
                        : 'rgba(148, 163, 184, 0.00)';

                    // Text
                    const fieldText = '#E5E7EB';


                    // Wichtig: Die optische HT/LT-Differenz im Table-Modus kommt primär über Inline-Styles.
                    // (Es existieren noch ältere CSS-Overrides für .player-table-tier-badge / .player-in-table.tier-HT*,
                    // die aber hier nicht mehr entscheidend sein sollen, da die Badge nicht gerendert wird.)

                    if (isAdminUser) {
                        // Admin select dropdown
                        let selectHtml = `<select class="admin-select" data-playerid="${player.id}" data-mode="${currentMode}" data-tierlistmode="${tierlistMode}" style="font-size: 0.7rem; padding: 0.3rem 0.5rem;">`;

                        for (let t of TIERS) {


                            const selected = (t === tier) ? "selected" : "";
                            selectHtml += `<option value="${t}" ${selected}>${t}</option>`;
                        }
                        selectHtml += `</select>`;
                        tierBadgeHtml = selectHtml;
                    }
                    
            html += `
<div class="player-in-table ${tier}" data-id="${player.id}" style="background: ${fieldBg}; border-color: ${fieldBorder};">
                            <div class="player-table-avatar">
                                <img src="${getPlayerAvatarUrl(player)}" alt="${player.name}" onerror="this.src='https://minotar.net/helm/steve/56.png'">
                            </div>
                            <div class="player-table-name" style="color: ${fieldText};">${escapeHtml(player.name)}</div>
                            ${tierBadgeHtml}

                            <div style="width: 56px;" aria-hidden="true"></div>
                            ${isAdminUser ? `
                                <input type="text" class="admin-region-input" value="${escapeHtml(player.region || 'NA')}" placeholder="Region" data-playerid="${player.id}" style="font-size: 0.7rem; min-width: 65px;">
                            ` : ""}


                        </div>
                    `;
                }
            }
            
            html += `</div></div>`;
        }

        html += '</div>';
        container.innerHTML = html;
        attachTablePlayerCardListeners();
        if (isAdminUser) {
            document.querySelectorAll(".admin-select[data-mode]").forEach(select => {
                select.removeEventListener("change", handleTierSelect);
                select.addEventListener("change", handleTierSelect);
            });
            // Region selects in table
            document.querySelectorAll(".admin-select:not([data-mode])").forEach(select => {
                select.removeEventListener("change", handleRegionChange);
                select.addEventListener("change", handleRegionChange);
            });
        }
    }

    function attachTablePlayerCardListeners() {
        document.querySelectorAll(".player-in-table").forEach(card => {
            card.addEventListener("mousedown", (e) => {
                if (!isAdminUser) return;
                if (e.button !== 0) return; // nur linker Klick
                if (!e.shiftKey) return;

                const playerId = card.getAttribute("data-id");
                if (!playerId) return;

                const direction = e.clientY < (window.innerHeight / 2) ? "up" : "down";

                // Only allow shifting when the neighbor has the same tier in the current mode
                const src = tierlistMode === "prime" ? (playersMap[playerId]?.primeTiers || playersMap[playerId]?.tiers || {}) : (playersMap[playerId]?.tiers || {});
                const baseTier = (src?.[currentMode]) || 'NT';
                const neighborAllowed = Array.from(document.querySelectorAll(`.player-in-table[data-id]`))

                    .map(el => el.getAttribute('data-id'))
                    .filter(id => id && playersMap[id] && id !== playerId)
                    .some(id => {
                    const src2 = tierlistMode === "prime" ? (playersMap[id]?.primeTiers || playersMap[id]?.tiers || {}) : (playersMap[id]?.tiers || {});
                    const t2 = src2?.[currentMode] || 'NT';
                    return t2 === baseTier;
                });


                if (!neighborAllowed) return;

                swapAdminPositionForPlayer(playerId, { direction, mode: currentMode });
            });

            card.addEventListener("click", (e) => {
                const playerId = card.getAttribute("data-id");
                if (playerId && playersMap[playerId]) {
                    openPlayerModal(playersMap[playerId]);
                }
            });
        });
    }


    function attachPlayerCardListeners() {
        document.querySelectorAll(".player-card").forEach(card => {
            card.addEventListener("mousedown", (e) => {
                if (!isAdminUser) return;
                if (e.button !== 0) return; // nur linker Klick
                if (!e.shiftKey) return;

                const playerId = card.getAttribute("data-id");
                if (!playerId) return;

        // Overall-Liste: up wenn Maus oben im Card-Bereich
                const rect = card.getBoundingClientRect();
                const direction = e.clientY < (rect.top + rect.height / 2) ? "up" : "down";

                // Only allow shifting among equal score/tier
                if (currentMode === 'overall') {
                    const basePoints = getPlayerTotalPoints(playersMap[playerId]);
                    const otherIsAllowed = Array.from(document.querySelectorAll(`.player-card[data-id]`))
                        .map(el => el.getAttribute('data-id'))
                        .filter(id => id && playersMap[id])
                        .some(id => getPlayerTotalPoints(playersMap[id]) === basePoints && id !== playerId);
                    if (!otherIsAllowed) return;
                } else {
                    const baseTier = playersMap[playerId]?.tiers?.[currentMode] || 'NT';
                    const otherIsAllowed = Array.from(document.querySelectorAll(`.player-in-table[data-id]`))
                        .map(el => el.getAttribute('data-id'))
                        .filter(id => id && playersMap[id])
                        .some(id => (playersMap[id]?.tiers?.[currentMode] || 'NT') === baseTier && id !== playerId);
                    if (!otherIsAllowed) return;
                }

                swapAdminPositionForPlayer(playerId, { direction, mode: currentMode });
            });

            card.addEventListener("click", (e) => {
                // Nicht triggern wenn auf Admin-Buttons geklickt wird
                if (e.target.closest(".admin-actions")) return;
                const playerId = card.getAttribute("data-id");
                if (playerId && playersMap[playerId]) {
                    openPlayerModal(playersMap[playerId]);
                }
            });
        });
    }


    function openPlayerModal(player) {
        const modal = document.getElementById("playerModal");
        const modalName = document.getElementById("modalPlayerName");
        const modalPosition = document.getElementById("modalPlayerPosition");
        const modalPoints = document.getElementById("modalPlayerPoints");
        const modalSkin = document.getElementById("modalSkinImage");
        const modalNameMc = document.getElementById("modalNameMcLink");
        const modalTiers = document.getElementById("modalTiersGrid");

        // Calculate player's overall position and total points
        let allPlayers = Object.values(playersMap);
        allPlayers.sort((a, b) => {
            const pointsA = getPlayerTotalPoints(a);
            const pointsB = getPlayerTotalPoints(b);
            return pointsB - pointsA;
        });
        
        const allPoints = allPlayers.map(p => getPlayerTotalPoints(p));
        const playerIndex = allPlayers.findIndex(p => p.id === player.id);
        const totalPoints = getPlayerTotalPoints(player);

        // Tie handling for modal (same Punkte => same Position/Rank, next rank skipped)
        let position = 0;
        if (playerIndex >= 0) {
            let lastPoints = null;
            let lastRank = 0;
            for (let i = 0; i < allPlayers.length; i++) {
                const p = allPoints[i];
                if (lastPoints === null || p !== lastPoints) {
                    lastRank = i + 1;
                    lastPoints = p;
                }
                if (allPlayers[i].id === player.id) {
                    position = lastRank;
                    break;
                }
            }
        }


        // Modal öffnen mit Loading-State
        modal.classList.add("active");
        modalName.innerHTML = `${escapeHtml(player.name)}${player.cracked ? ` <span class="cracked-badge" style="margin-left:0.6rem; font-size:0.65rem;">CRACKED</span>` : ``}`;
        modalPosition.textContent = `#${position}`;

        // Skin-Override nur für cracked Spieler (Admin)
        const existingSkinName = player.cracked ? (player.skinName || "") : "";
        const skinOverrideHtml = (isAdminUser && player.cracked)

        // Bind save handler (cracked only)

        modalPoints.textContent = `${totalPoints} Punkte`;

        };
        modalSkin.onerror = () => {

        };
        modalSkin.src = `https://visage.surgeplay.com/full/512/${encodeURIComponent(skinNameToUse)}`;



        // NameMC Link
        modalNameMc.href = `https://namemc.com/profile/${encodeURIComponent(player.name)}`;

<div class="tier-oval-badge" style="background: transparent; border: 2px solid ${colorInfo.border}; box-shadow: 0 0 12px rgba(0,0,0,0.0);">

        try {
            await set(ref(db, tierPath), newTier);

            await set(ref(db, metaPath), Date.now());

    async function swapAdminPositionForPlayer(playerId, { direction, mode }) {
        if (!isAdminUser) return;
        if (!playerId || !direction) return;

        // prevent accidental concurrent swaps
        if (window.__echotiersSwapInProgress) return;
        window.__echotiersSwapInProgress = true;

        try {
            const player = playersMap[playerId];
            if (!player) return;

            const allPlayers = Object.values(playersMap);

            // overall: order determined by total points; we swap deterministic tie-breaking key
            if (mode === 'overall') {
                const points = getPlayerTotalPoints(player);

                const tieGroup = allPlayers.filter(p => getPlayerTotalPoints(p) === points);
                if (tieGroup.length < 2) return;

                const orderModeId = GAME_MODES.find(m => m.id !== 'overall')?.id;
                if (!orderModeId) return;

                const key = (p) => p.tierMeta?.[orderModeId]?.setAt ?? 0;
                tieGroup.sort((a, b) => key(a) - key(b) || a.name.localeCompare(b.name));

                const idx = tieGroup.findIndex(p => p.id === playerId);
                if (idx < 0) return;

                const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
                if (swapIdx < 0 || swapIdx >= tieGroup.length) return;

                const other = tieGroup[swapIdx];

                const aSetAtRef = ref(db, `players/${playerId}/tierMeta/${orderModeId}/setAt`);
                const bSetAtRef = ref(db, `players/${other.id}/tierMeta/${orderModeId}/setAt`);

                const aSetAt = player.tierMeta?.[orderModeId]?.setAt ?? 0;
                const bSetAt = other.tierMeta?.[orderModeId]?.setAt ?? 0;

                await set(aSetAtRef, bSetAt);
                await set(bSetAtRef, aSetAt);

                // local update
                playersMap[playerId].tierMeta = playersMap[playerId].tierMeta || {};
                playersMap[other.id].tierMeta = playersMap[other.id].tierMeta || {};
                playersMap[playerId].tierMeta[orderModeId] = playersMap[playerId].tierMeta[orderModeId] || {};
                playersMap[other.id].tierMeta[orderModeId] = playersMap[other.id].tierMeta[orderModeId] || {};
                playersMap[playerId].tierMeta[orderModeId].setAt = bSetAt;
                playersMap[other.id].tierMeta[orderModeId].setAt = aSetAt;

                renderPlayers();
                return;
            }

            // modes table (non-overall)
            const modeId = mode;
            const playerTier = player.tiers?.[modeId] || 'NT';

            const columnPlayers = allPlayers.filter(p => (p.tiers?.[modeId] || 'NT') === playerTier);
            if (columnPlayers.length < 2) return;

            columnPlayers.sort((a, b) => {
                const aSetAt = a.tierMeta?.[modeId]?.setAt ?? 0;
                const bSetAt = b.tierMeta?.[modeId]?.setAt ?? 0;
                if (aSetAt !== bSetAt) return aSetAt - bSetAt;
                return a.name.localeCompare(b.name);
            });

            const idx = columnPlayers.findIndex(p => p.id === playerId);
            if (idx < 0) return;

            const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
            if (swapIdx < 0 || swapIdx >= columnPlayers.length) return;

            const other = columnPlayers[swapIdx];

            const aRef = ref(db, `players/${playerId}/tierMeta/${modeId}/setAt`);
            const bRef = ref(db, `players/${other.id}/tierMeta/${modeId}/setAt`);

            const aSetAt = player.tierMeta?.[modeId]?.setAt ?? 0;
            const bSetAt = other.tierMeta?.[modeId]?.setAt ?? 0;

            await set(aRef, bSetAt);
            await set(bRef, aSetAt);

            playersMap[playerId].tierMeta = playersMap[playerId].tierMeta || {};
            playersMap[other.id].tierMeta = playersMap[other.id].tierMeta || {};
            playersMap[playerId].tierMeta[modeId] = playersMap[playerId].tierMeta[modeId] || {};
            playersMap[other.id].tierMeta[modeId] = playersMap[other.id].tierMeta[modeId] || {};
            playersMap[playerId].tierMeta[modeId].setAt = bSetAt;
            playersMap[other.id].tierMeta[modeId].setAt = aSetAt;

            renderPlayers();
        } finally {
            window.__echotiersSwapInProgress = false;
        }
    }


async function addNewPlayer() {
        const rawName = prompt("Name des Spielers:", "Neuer Spieler");
        if (!rawName || rawName.trim() === "") return;

        const { name, cracked } = parsePlayerInput(rawName);
        if (!name) {
            alert("Bitte einen gültigen Spielernamen eingeben (z.B. 'Lukas' oder '/Lukas').");
            return;
        }

        let id = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
        if (!id) id = "player_" + Date.now();
        if (playersMap[id]) {
            alert("Dieser Spieler existiert bereits!");

        }

        const region = (regionChoice && (regionChoice.toUpperCase() === "EU" || regionChoice.toUpperCase() === "NA")) ? regionChoice.toUpperCase() : "NA";
        
        const defaultTiers = {};
        for (const m of GAME_MODES) defaultTiers[m.id] = "NT";   // Startet mit NT

        try {
            await set(ref(db, `players/${id}`), newPlayer);
        } catch(e) {
            alert("Fehler beim Erstellen: " + e.message);
        }
    }

    // --- Firebase Listener realtime ---
    function subscribePlayers() {
        const playersRef = ref(db, "players");
        onValue(playersRef, (snap) => {
            const data = snap.val();
            if (data) {
                const newMap = {};
                for (const [id, val] of Object.entries(data)) {
                    if (val && typeof val === 'object') {
                        // Current tiers
                        let tiers = val.tiers || {};
                        // Only set default NT for non-overall modes
                        for (const mode of GAME_MODES) {
                            if (mode.id !== "overall" && !tiers[mode.id]) {
                                tiers[mode.id] = "NT";
                            }
                        }

                        const tierMeta = val.tierMeta || {};

                        // Prime tiers (new)
                        let primeTiers = val.primeTiers || null;
                        if (!primeTiers) {
                            // Prime starts identical to Current
                            primeTiers = { ...tiers };
                        }
                        for (const mode of GAME_MODES) {
                            if (mode.id !== "overall" && !primeTiers[mode.id]) {
                                primeTiers[mode.id] = "NT";
                            }
                        }

                        const primeTierMeta = val.primeTierMeta || {};

                        newMap[id] = { 
                            id,
                            name: val.name || "Unbekannt",
                            cracked: !!val.cracked,
                            skinName: val.skinName || "",
                            tiers,
                            tierMeta,
                            primeTiers,
                            primeTierMeta,
                            overallAliasText: val.overallAliasText || "NA",
                            overallAliasColor: val.overallAliasColor || "#06B6D4",
                            notes: val.notes || ""
                        };
                    }
                }
                playersMap = newMap;

            } else {
                playersMap = {};
            }
            renderPlayers();
        });
    }


    // --- UI Komponenten bauen: Modus Buttons, Filter-Listener ---
    function buildUI() {
        const modesContainer = document.getElementById("modesList");
        modesContainer.innerHTML = "";
        GAME_MODES.forEach(mode => {
            const btn = document.createElement("button");
            btn.className = `mode-btn-modern ${currentMode === mode.id ? 'active' : ''}`;
            if (mode.image) {
